name: Compilar OkPiso APK Limpia

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar archivos
        uses: actions/checkout@v4

      - name: 2. Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Preparar web
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: 5. Crear proyecto Android con Plugins y Permisos
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/filesystem @capacitor/share
          npx cap init "OkPiso" "com.sitorm.okpiso" --web-dir www
          npx cap add android
          npx cap sync android
          echo 'configurations.all { resolutionStrategy { force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22", "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22", "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22" } }' >> android/app/build.gradle
          cat << 'EOF' > android/app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="my_cache_images" path="." />
              <external-path name="my_images" path="." />
              <files-path name="my_files" path="." />
          </paths>
          EOF

      - name: 6. Poner icono OkPiso sin conflictos
        run: |
          if [ -f "okpiso-icon.png" ]; then
            for dir in android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi; do
              if [ -d "$dir" ]; then
                cp okpiso-icon.png "$dir/ic_launcher.png"
                cp okpiso-icon.png "$dir/ic_launcher_round.png"
                cp okpiso-icon.png "$dir/ic_launcher_foreground.png"
              fi
            done
          fi

      - name: 7. Compilar APK limpia
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 8. Guardar OkPiso.apk
        uses: actions/upload-artifact@v4
        with:
          name: OkPiso-APK-Limpia
          path: android/app/build/outputs/apk/debug/app-debug.apk
