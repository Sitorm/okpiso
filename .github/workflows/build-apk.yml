name: Compilar OkPiso APK Limpia

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar archivos
        uses: actions/checkout@v4

      - name: 2. Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Preparar web
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: 5. Crear proyecto Android
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "OkPiso" "com.sitorm.okpiso" --web-dir www
          npx cap add android

      - name: 6. Poner icono OkPiso
        run: |
          if [ -f "okpiso-icon.png" ]; then
            for dir in android/app/src/main/res/mipmap-*; do
              cp okpiso-icon.png "$dir/ic_launcher.png"
              cp okpiso-icon.png "$dir/ic_launcher_round.png"
              cp okpiso-icon.png "$dir/ic_launcher_foreground.png"
            done
          fi

      - name: 7. Compilar APK limpia
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 8. Guardar OkPiso.apk
        uses: actions/upload-artifact@v4
        with:
          name: OkPiso-APK-Limpia
          path: android/app/build/outputs/apk/debug/app-debug.apk
